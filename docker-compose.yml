services:
  db:
    image: postgres:16-alpine
    container_name: datapulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapulse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-datapulse}
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - datapulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datapulse-api
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapulse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-datapulse}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      OPEN_METEO_LATITUDE: ${OPEN_METEO_LATITUDE:-28.6139}
      OPEN_METEO_LONGITUDE: ${OPEN_METEO_LONGITUDE:-77.2090}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  datapulse_postgres_data:
